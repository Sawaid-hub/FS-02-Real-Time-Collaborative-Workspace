# Render.com Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# To deploy: Connect your repository on Render and create a "New Blueprint Instance"

services:
  # ---------------------------------------------------------------------------
  # 1. Main Next.js Web Service (Frontend, SSR, and REST API Routes)
  # ---------------------------------------------------------------------------
  - type: web
    name: fs02-workspace-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    healthCheckPath: /api/auth/providers
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fs02-postgres
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: NEXT_PUBLIC_COLLAB_URL
        fromService:
          type: web
          name: fs02-workspace-collab
          property: host

  # ---------------------------------------------------------------------------
  # 2. Real-Time Collaboration WebSocket Service (Yjs CRDT & Presence Sync)
  # ---------------------------------------------------------------------------
  - type: web
    name: fs02-workspace-collab
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npm run start:collab
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fs02-postgres
          property: connectionString
      - key: AUTH_SECRET
        fromService:
          type: web
          name: fs02-workspace-web
          envVarKey: AUTH_SECRET

databases:
  # ---------------------------------------------------------------------------
  # 3. Managed PostgreSQL Database
  # ---------------------------------------------------------------------------
  - name: fs02-postgres
    plan: free
    region: oregon
    databaseName: fs02
    user: fs02_user
